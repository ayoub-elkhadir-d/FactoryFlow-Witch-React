services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: factoryflow_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/factoryflow
      JWT_SECRET: ${JWT_SECRET:-supersecretkeyfactoryflow2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-FactoryFlow Admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@grr.la}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: factoryflow_mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["seed"]
    command: ["npm", "run", "seed"]
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/factoryflow
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-FactoryFlow Admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@grr.la}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
    name: factoryflow_mongo_data
